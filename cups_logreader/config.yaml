name: "CUPS Log Reader"
version: "0.2.0"
slug: "cups_logreader"
description: "Reads CUPS page_log and publishes per-queue page counts to MQTT"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-check
map:
  - all_addon_configs:ro
  - addon_config:rw
options:
  cups_addon_slug: "2c6aefcc_cupsik"
  mqtt_host: "192.168.1.x"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  poll_interval_seconds: 60
  queues: ""
schema:
  cups_addon_slug: str
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  poll_interval_seconds: int
